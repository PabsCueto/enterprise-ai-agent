name: docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t enterprise-ai-agent:ci .

      - name: Image checks (non-root, no secrets or data baked in)
        run: |
          test "$(docker run --rm enterprise-ai-agent:ci id -u)" != "0"
          docker run --rm enterprise-ai-agent:ci sh -c 'test ! -e /app/.env && test -z "$(ls -A /app/data)"'

      - name: Start container with a minimal index
        run: |
          mkdir ci-data && chmod 777 ci-data
          docker run --rm -v "$PWD/ci-data:/app/data" enterprise-ai-agent:ci python scripts/make_smoke_index.py /app/data/index.json
          # La clave es falsa: /health no llama a Gemini. Sin usuarios configurados, /ask debe rechazar todo.
          docker run -d --name agent -p 8000:8000 -v "$PWD/ci-data:/app/data" -e GEMINI_API_KEY=ci-dummy-key enterprise-ai-agent:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"chunks":1'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/ask -H 'Content-Type: application/json' -d '{"question": "¿Qué es Lambda?"}')" = "401"
          test "$(docker exec agent id -u)" != "0"

      - name: Container logs
        if: always()
        run: |
          docker logs agent || true
          docker stop agent || true
